services:
  - type: web
    name: resqnow-api-vinaythilak23
    runtime: node
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: npm ci && npx prisma generate
    startCommand: npx prisma migrate deploy && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: DATABASE_URL
        fromDatabase:
          name: resqnow-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_URL
        value: https://vinaythilak23.github.io

databases:
  - name: resqnow-db
    databaseName: resqnow
    user: resqnow
    plan: free
    postgresMajorVersion: "17"
    region: oregon